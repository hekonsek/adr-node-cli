syllabus:
  description: Guidance for Node CLI architecture and tooling choices.
  topics:
    - CLI fundamentals:
        - process.argv
    - Node CLI frameworks:
        - util.parseArgs (Node built-in)
        - Commander.js (Most popular)
    - Visual effects:
        - Chalk (Colorful output)
        - Ora (Spinners)
    - Logging:
        - Configuring logger with CLI options 
    - Security:
        - What makes CLIs special:
            - Local execution context
            - Direct OS access
            - User permissions & privileges
            - Often relies on invoking other system commands
            - Often run in CI/CD with elevated credentials
        - Best practices:
            - Use execFile instead of exec and spawn to avoid shell injection